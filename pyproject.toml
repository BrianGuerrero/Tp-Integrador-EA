[project]
name = "tpi-hba1c"
version = "1.0.0"
description = "TP Integrador EAyMR 2026 — Decision Intelligence: HbA1c y reinternación a 30 días"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks/TP_Integrador_Final.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402", "B023", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "F401", "B018", "E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
